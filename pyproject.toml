[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-assistant"
version = "0.1.2"
description = "Offline source security triage and code navigation for application security reviewers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
appsec-assistant = "appsec_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["appsec_assistant*"]

[tool.ruff]
target-version = "py311"
include = ["appsec_assistant/**/*.py", "tests/**/*.py", "benchmarks/*.py", "scan.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
