[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-assistant"
version = "0.1.0"
description = "Offline source security triage and code navigation for application security reviewers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
appsec-assistant = "appsec_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["appsec_assistant*"]
